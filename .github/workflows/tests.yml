name: Tests & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: eebc_test
          POSTGRES_USER: eebc_test
          POSTGRES_PASSWORD: eebc_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt

    - name: Reject syntax and undefined-name errors
      run: |
        flake8 apps gestion_eebc --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Reject whitespace errors introduced by the commit
      run: git diff --check HEAD^ HEAD

    # The repository predates the current formatting policy. Keep the complete
    # reports visible while avoiding a risky 397-file rewrite during migration.
    - name: Report legacy flake8 debt
      continue-on-error: true
      run: |
        flake8 apps --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Report legacy Black debt
      continue-on-error: true
      run: |
        black --check apps gestion_eebc

    - name: Report legacy isort debt
      continue-on-error: true
      run: |
        isort --check-only apps gestion_eebc

    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql://eebc_test:eebc_test_password@localhost:5432/eebc_test
        DJANGO_SETTINGS_MODULE: gestion_eebc.settings.test
        SECRET_KEY: ci-test-secret-key-that-is-long-enough-2026
      run: |
        pytest --cov=apps --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
        pip install bandit pip-audit

    - name: Run Bandit security check
      run: |
        bandit -r apps gestion_eebc --skip B101,B601,B607 --severity-level medium

    - name: Check for known vulnerabilities
      run: |
        pip-audit --requirement requirements/prod.txt

    - name: Django security checks
      env:
        DJANGO_SETTINGS_MODULE: gestion_eebc.settings.prod
        SECRET_KEY: ci-production-secret-key-that-is-long-enough-2026
        DATABASE_URL: postgresql://eebc_test:eebc_test_password@localhost:5432/eebc_test
        REDIS_URL: redis://127.0.0.1:6379/0
        TRUSTED_PROXY_IPS: 127.0.0.1/32
        ALLOWED_HOSTS: localhost,127.0.0.1
        CSRF_TRUSTED_ORIGINS: https://localhost
        MEDIA_STORAGE_BACKEND: cloudinary
        CLOUDINARY_URL: cloudinary://ci_key:ci_secret@ci_cloud
      run: |
        python manage.py check --deploy --fail-level ERROR

  docker-image:
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - uses: actions/checkout@v4

    - name: Build production image
      run: |
        docker build --pull --tag gestion-eebc:${{ github.sha }} .
