name: Code Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
        pip install pylint

    - name: Pylint analysis
      run: |
        pylint apps gestion_eebc --exit-zero --output-format=json > pylint-report.json || true

    - name: Complexity check with radon
      run: |
        pip install radon
        radon cc apps -s -j > complexity.json || true
        radon mi apps -j > metrics.json || true

    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          pylint-report.json
          complexity.json
          metrics.json

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const pylint = JSON.parse(fs.readFileSync('pylint-report.json', 'utf8'));
            const score = pylint.length > 0 ? 'Check completed' : 'No findings';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Code Quality Analysis\n${score}`
            });
          } catch (e) {
            console.log('Could not parse reports');
          }

  dependency-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Check dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/prod.txt pip-audit
        pip-audit --skip-editable --desc || true

  sast:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Semgrep
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/django
          p/python
