x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: gestion_eebc.settings.prod
  DEBUG: "False"
  PORT: "8000"
  WEB_CONCURRENCY: "2"
  GUNICORN_FORWARDED_ALLOW_IPS: "*"

  SECRET_KEY: "${SECRET_KEY:?}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:?}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:?}"
  TRUSTED_CLIENT_IP_HEADER: "${TRUSTED_CLIENT_IP_HEADER:-}"

  DATABASE_URL: "${DATABASE_URL:?}"
  REDIS_URL: "${REDIS_URL:?}"
  CELERY_BROKER_URL: "${REDIS_URL:?}"
  CELERY_RESULT_BACKEND: "${REDIS_URL:?}"

  MEDIA_STORAGE_BACKEND: "${MEDIA_STORAGE_BACKEND:-cloudinary}"
  CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_STORAGE_BUCKET_NAME: "${AWS_STORAGE_BUCKET_NAME:-}"
  AWS_S3_ENDPOINT_URL: "${AWS_S3_ENDPOINT_URL:-}"
  AWS_S3_REGION_NAME: "${AWS_S3_REGION_NAME:-}"
  AWS_S3_ADDRESSING_STYLE: "${AWS_S3_ADDRESSING_STYLE:-path}"
  AWS_S3_CUSTOM_DOMAIN: "${AWS_S3_CUSTOM_DOMAIN:-}"
  AWS_LOCATION: "${AWS_LOCATION:-media}"

  EMAIL_BACKEND: "${EMAIL_BACKEND:-hostinger}"
  HOSTINGER_API_KEY: "${HOSTINGER_API_KEY:-}"
  HOSTINGER_EMAIL_HOST: "${HOSTINGER_EMAIL_HOST:-smtp.hostinger.com}"
  HOSTINGER_EMAIL_PORT: "${HOSTINGER_EMAIL_PORT:-587}"
  HOSTINGER_EMAIL_USE_TLS: "${HOSTINGER_EMAIL_USE_TLS:-True}"
  HOSTINGER_EMAIL_USE_SSL: "${HOSTINGER_EMAIL_USE_SSL:-False}"
  HOSTINGER_EMAIL_HOST_USER: "${HOSTINGER_EMAIL_HOST_USER:-}"
  HOSTINGER_EMAIL_HOST_PASSWORD: "${HOSTINGER_EMAIL_HOST_PASSWORD:-}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-EEBC <contact@eglise-ebc.org>}"

  SITE_URL: "${SITE_URL:-https://eglise-ebc.org}"
  SITE_NAME: "${SITE_NAME:-EEBC}"
  SENTRY_DSN: "${SENTRY_DSN:-}"

  STRIPE_PUBLIC_KEY: "${STRIPE_PUBLIC_KEY:-}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
  STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-https://eglise-ebc.org/don/succes/}"
  STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-https://eglise-ebc.org/don/annule/}"

  META_WHATSAPP_ACCESS_TOKEN: "${META_WHATSAPP_ACCESS_TOKEN:-}"
  META_WHATSAPP_PHONE_NUMBER_ID: "${META_WHATSAPP_PHONE_NUMBER_ID:-}"
  META_WHATSAPP_VERIFY_TOKEN: "${META_WHATSAPP_VERIFY_TOKEN:-}"
  META_WHATSAPP_APP_SECRET: "${META_WHATSAPP_APP_SECRET:-}"
  META_WHATSAPP_API_VERSION: "${META_WHATSAPP_API_VERSION:-v23.0}"

  TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
  TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  migrate:
    build: *app-build
    environment: *app-environment
    command: ["./migrate.sh"]
    restart: "no"
    exclude_from_hc: true
    networks:
      - default
      - coolify
    healthcheck:
      disable: true

  web:
    build: *app-build
    environment: *app-environment
    command: ["./start.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - default
      - coolify
    healthcheck:
      # Django rejette tout Host absent d'ALLOWED_HOSTS : une sonde qui appelle
      # 127.0.0.1 recoit un 400 DisallowedHost et le service reste unhealthy en
      # permanence. La sonde se presente donc avec le premier hote autorise.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ['ALLOWED_HOSTS'].split(',')[0].strip();
          req = urllib.request.Request('http://127.0.0.1:8000/healthz/ping/', headers={'Host': host});
          urllib.request.urlopen(req, timeout=5).read()
      interval: 30s
      timeout: 7s
      start_period: 30s
      retries: 3

  worker:
    build: *app-build
    environment: *app-environment
    command:
      - celery
      - -A
      - gestion_eebc
      - worker
      - --loglevel=info
      - --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default
      - coolify
    healthcheck:
      disable: true

networks:
  coolify:
    external: true
    name: coolify
