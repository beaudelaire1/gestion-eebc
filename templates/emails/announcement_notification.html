<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ announcement.title }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f6f8;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:640px;background:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:28px 32px 16px 32px;">
                            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;">
                                {{ priority_label }} · EEBC
                            </div>
                            <h1 style="margin:10px 0 0 0;font-size:24px;line-height:1.3;color:#111827;">
                                {{ announcement.title }}
                            </h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 30px 32px;font-size:16px;line-height:1.65;color:#374151;white-space:pre-line;">
                            {% if recipient_name %}<p>Bonjour {{ recipient_name }},</p>{% endif %}
                            <p>{{ announcement.content }}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 32px;background:#f9fafb;font-size:12px;line-height:1.5;color:#6b7280;">
                            Vous recevez ce message selon vos préférences de notification EEBC.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
