# =============================================================================
# RENDER BLUEPRINT - Gestion EEBC / branche develop
# =============================================================================
# Production topology:
# - paid web service: SMTP + pre-deploy migrations are required by this project
# - paid worker: Celery background processing
# - persistent Render Key Value: shared cache + durable Celery broker
# - paid PostgreSQL: no 30-day expiry + managed point-in-time recovery
# - Python version is pinned once in .python-version
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Django web application
  # ---------------------------------------------------------------------------
  - type: web
    name: gestion-eebc
    runtime: python
    branch: develop
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput && python manage.py setup_sites
    startCommand: ./start.sh
    healthCheckPath: /healthz/ping/
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_eebc.settings.prod
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.eglise-ebc.org"
      - key: TRUSTED_CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: DATABASE_URL
        fromDatabase:
          name: eebc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eebc-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: eebc-redis
          property: connectionString

      # Email Hostinger
      - key: EMAIL_BACKEND
        value: hostinger
      - key: HOSTINGER_API_KEY
        sync: false
      - key: HOSTINGER_EMAIL_HOST
        value: smtp.hostinger.com
      - key: HOSTINGER_EMAIL_PORT
        value: "587"
      - key: HOSTINGER_EMAIL_USE_TLS
        value: "True"
      - key: HOSTINGER_EMAIL_HOST_USER
        sync: false
      - key: HOSTINGER_EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "EEBC <contact@eglise-ebc.org>"

      # Persistent media storage / observability
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

      # Stripe
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: "https://eglise-ebc.org/don/succes/"
      - key: STRIPE_CANCEL_URL
        value: "https://eglise-ebc.org/don/annule/"

      # Meta WhatsApp Cloud API
      - key: META_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_WHATSAPP_APP_SECRET
        sync: false
      - key: META_WHATSAPP_API_VERSION
        value: "v23.0"

      # Anti-bot
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # Site
      - key: SITE_URL
        value: "https://eglise-ebc.org"
      - key: SITE_NAME
        value: "EEBC"

  # ---------------------------------------------------------------------------
  # Celery worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: gestion-eebc-worker
    runtime: python
    branch: develop
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements/prod.txt
    startCommand: celery -A gestion_eebc worker --loglevel=info --concurrency=2
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_eebc.settings.prod
      - key: SECRET_KEY
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: eebc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eebc-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: eebc-redis
          property: connectionString
      - key: TRUSTED_CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: CLOUDINARY_URL
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: CLOUDINARY_URL
      - key: EMAIL_BACKEND
        value: hostinger
      - key: HOSTINGER_API_KEY
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_API_KEY
      - key: HOSTINGER_EMAIL_HOST
        value: smtp.hostinger.com
      - key: HOSTINGER_EMAIL_PORT
        value: "587"
      - key: HOSTINGER_EMAIL_USE_TLS
        value: "True"
      - key: HOSTINGER_EMAIL_HOST_USER
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_EMAIL_HOST_USER
      - key: HOSTINGER_EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        value: "EEBC <contact@eglise-ebc.org>"
      - key: SENTRY_DSN
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: SENTRY_DSN

  # ---------------------------------------------------------------------------
  # Shared Redis-compatible cache and Celery broker.
  # Persistent because queued Celery jobs must not disappear on a restart.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: eebc-redis
    region: frankfurt
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

  # ---------------------------------------------------------------------------
  # Daily notification job: 07:00 America/Cayenne = 10:00 UTC.
  # Render evaluates all cron schedules in UTC.
  # ---------------------------------------------------------------------------
  - type: cron
    name: eebc-daily-notifications
    runtime: python
    branch: develop
    region: frankfurt
    plan: 0.5c-512mb
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements/prod.txt
    startCommand: python manage.py run_notifications --all
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: gestion_eebc.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: eebc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eebc-redis
          property: connectionString
      - key: TRUSTED_CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP
      - key: SECRET_KEY
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: SECRET_KEY
      - key: CLOUDINARY_URL
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: CLOUDINARY_URL
      - key: SENTRY_DSN
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: SENTRY_DSN
      - key: EMAIL_BACKEND
        value: hostinger
      - key: HOSTINGER_API_KEY
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_API_KEY
      - key: HOSTINGER_EMAIL_HOST
        value: smtp.hostinger.com
      - key: HOSTINGER_EMAIL_PORT
        value: "587"
      - key: HOSTINGER_EMAIL_USE_TLS
        value: "True"
      - key: HOSTINGER_EMAIL_HOST_USER
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_EMAIL_HOST_USER
      - key: HOSTINGER_EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: gestion-eebc
          envVarKey: HOSTINGER_EMAIL_HOST_PASSWORD
      - key: DEFAULT_FROM_EMAIL
        value: "EEBC <contact@eglise-ebc.org>"

# =============================================================================
# PostgreSQL
# Paid instance avoids the 30-day free-database expiry and enables Render PITR.
# =============================================================================
databases:
  - name: eebc-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: eebc
    user: eebc_user
